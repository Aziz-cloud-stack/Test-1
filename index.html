<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 1</title>
<style>
html,body{margin:0;background:#fff;font-family:"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px;text-align:center}
svg{width:100%;height:auto;display:block;-webkit-tap-highlight-color:transparent}
.band{cursor:pointer;outline:none;transition:opacity .25s,transform .25s,filter .25s;transform-box:fill-box;transform-origin:center}
.label{transition:opacity .25s;cursor:pointer}
.label text{transition:font-size .2s}
svg.focus .band:not(.on),svg.focus .label:not(.on){opacity:.35}
.band.on{filter:brightness(1.15) drop-shadow(0 6px 10px rgba(76,29,149,.35));transform:scale(1.04)}
.label.on text{font-size:22px}
#readout{height:40px;margin-top:4px;font-size:28px;font-weight:700;color:#6d28d9}
#readout span{font-size:16px;font-weight:600;color:#7a7090;margin-left:8px}
.hint{margin:0;color:#7a7090;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div id="art"></div>
<div id="readout" aria-live="polite"></div>
<p class="hint">Hover or tap a band</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Numbers used if numbers.xlsx can't be read. Top of the diamond first.
const FALLBACK = [20, 40, 80, 80, 40, 20];
const DATA_FILE = "numbers.xlsx";

const f = (n) => n.toFixed(1);
function diamondSvg(COUNTS) {
  const total = COUNTS.reduce((a, b) => a + b, 0), n = COUNTS.length;
  // widest point sits just below the largest band
  let m = COUNTS.reduce((best, c, i) => (c > COUNTS[best] ? i : best), 0);
  if (m === n - 1 && n > 1) m = n - 2;
  let crown = COUNTS.slice(0, m + 1).reduce((a, b) => a + b, 0), pav = total - crown;
  if (n === 1) { crown = total * 0.55; pav = total * 0.45; }
  const K = 420 / total, top = crown * K, bot = pav * K, R = 150, E = (14 * Math.PI) / 180, CX = 280;
  const CY = 40 + top * Math.cos(E);
  const proj = ([x, y, z]) => [CX + x, CY - z * Math.cos(E) - y * Math.sin(E)];
  const view = [0, -Math.cos(E), Math.sin(E)];
  const unit = (a) => { const l = Math.hypot(...a); return a.map((c) => c / l); };
  const light = unit([-0.55, -0.6, 0.7]);
  const sub = (a, b) => a.map((c, i) => c - b[i]);
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const lerp = (a, b, t) => a.map((c, i) => c + (b[i] - c) * t);
  const girdle = Array.from({ length: 6 }, (_, i) => [R * Math.cos((i * Math.PI) / 3), R * Math.sin((i * Math.PI) / 3), 0]);
  const APEX = [0, 0, top], TIP = [0, 0, -bot];
  const onEdge = (v, z) => (z >= 0 ? lerp(v, APEX, z / top) : lerp(v, TIP, -z / bot));
  const cuts = [top];
  COUNTS.forEach((c) => cuts.push(cuts[cuts.length - 1] - c * K));
  cuts[cuts.length - 1] = -bot;
  let gem = "", labels = "", lastY = -1e9;
  COUNTS.forEach((count, b) => {
    const z1 = cuts[b], z0 = cuts[b + 1];
    gem += `<g class="band" data-i="${b}" tabindex="0" role="button" aria-label="${count}, ${((100 * count) / total).toFixed(1)}% of ${total}">`;
    for (let i = 0; i < 6; i++) {
      const a = girdle[i], c = girdle[(i + 1) % 6];
      for (const up of [true, false]) {
        const lo = up ? Math.max(z0, 0) : z0, hi = up ? z1 : Math.min(z1, 0);
        if (hi <= lo + 1e-6 || (up ? top : bot) <= 0) continue;
        const pk = up ? APEX : TIP;
        const nrm = unit(up ? cross(sub(c, a), sub(pk, a)) : cross(sub(pk, a), sub(c, a)));
        if (dot(nrm, view) <= 0) continue;
        const t = Math.min(1, (up ? 0.35 : 0.12) + Math.max(0, dot(nrm, light)) * 0.65) - 0.5;
        const pp = [onEdge(a, lo), onEdge(c, lo), onEdge(c, hi), onEdge(a, hi)].map(proj).map((p) => f(p[0]) + "," + f(p[1])).join(" ");
        gem += `<polygon points="${pp}" fill="url(#gg)"/><polygon points="${pp}" fill="${t > 0 ? "#fff" : "#1a0638"}" fill-opacity="${Math.abs(t * 0.9).toFixed(2)}" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>`;
      }
    }
    gem += `</g>`;
    const e = proj(onEdge(girdle[0], (z0 + z1) / 2)), lx = CX + R + 60;
    const ly = Math.max(e[1], lastY + 24); lastY = ly;
    labels += `<g class="label" data-i="${b}"><path d="M${f(e[0] + 8)} ${f(e[1])}H${lx - 26}L${lx - 10} ${f(ly)}" fill="none" stroke="#c9bde6"/><circle cx="${f(e[0] + 8)}" cy="${f(e[1])}" r="2.2" fill="#6d28d9"/><text x="${lx}" y="${f(ly + 6)}" font-size="18" font-weight="700" fill="#6d28d9" text-anchor="start">${count}</text></g>`;
  });
  const tp = proj(TIP), ap = proj(APEX), H = Math.ceil(Math.max(tp[1] + 40, lastY + 30));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 ${H}" role="img" aria-label="Purple faceted diamond in ${n} bands: ${COUNTS.join(", ")}">
<defs><linearGradient id="gg" gradientUnits="userSpaceOnUse" x1="0" y1="${f(ap[1])}" x2="0" y2="${f(tp[1])}"><stop offset="0" stop-color="#f0abfc"/><stop offset=".35" stop-color="#c084fc"/><stop offset=".62" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b0d8c"/></linearGradient>
<radialGradient id="sh"><stop offset="0" stop-color="#3b1a7a" stop-opacity=".28"/><stop offset="1" stop-color="#3b1a7a" stop-opacity="0"/></radialGradient></defs>
<ellipse cx="${f(tp[0])}" cy="${f(tp[1] + 18)}" rx="120" ry="14" fill="url(#sh)"/>${gem}${labels}</svg>`;
}

const art = document.getElementById("art"), out = document.getElementById("readout");
let pinned = null;
let outsideBound = false;

function draw(COUNTS) {
  const TOTAL = COUNTS.reduce((a, b) => a + b, 0);
  art.innerHTML = diamondSvg(COUNTS);
  const svg = art.querySelector("svg");
  const bands = [...svg.querySelectorAll(".band")], labels = [...svg.querySelectorAll(".label")];
  pinned = null;
  out.innerHTML = "";
  const show = (i) => {
    svg.classList.toggle("focus", i !== null);
    bands.forEach((b, j) => b.classList.toggle("on", j === i));
    labels.forEach((l, j) => l.classList.toggle("on", j === i));
    out.innerHTML = i === null ? "" : COUNTS[i] + "<span>" + ((100 * COUNTS[i]) / TOTAL).toFixed(1) + "% of " + TOTAL + "</span>";
    if (i !== null) bands[i].parentNode.appendChild(bands[i]);
  };
  [...bands, ...labels].forEach((el) => {
    const i = +el.dataset.i;
    el.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") show(i); });
    el.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") show(pinned); });
    el.addEventListener("click", () => { pinned = pinned === i ? null : i; show(pinned); });
  });
  bands.forEach((b) => {
    b.addEventListener("focus", () => show(+b.dataset.i));
    b.addEventListener("blur", () => show(pinned));
    b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); b.click(); } });
  });
  window.__clear = () => { pinned = null; show(null); };
  if (!outsideBound) {
    outsideBound = true;
    document.addEventListener("click", (e) => { if (!e.target.closest(".band,.label")) window.__clear(); });
  }
}

// Read the numbers from numbers.xlsx: every positive number in column B, top to bottom.
async function loadNumbers() {
  try {
    if (typeof XLSX === "undefined") return null;
    const res = await fetch(DATA_FILE + "?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return null;
    const wb = XLSX.read(await res.arrayBuffer(), { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true });
    const nums = [];
    for (const r of rows) {
      const v = Number(String(r[1] ?? "").replace(/,/g, ""));
      if (String(r[0] ?? "").trim().toLowerCase() === "total") continue;
      if (isFinite(v) && v > 0) nums.push(v);
    }
    return nums.length ? nums : null;
  } catch { return null; }
}

draw(FALLBACK);
loadNumbers().then((nums) => { if (nums && nums.join() !== FALLBACK.join()) draw(nums); });
</script>
</body>
</html>
