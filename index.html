<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 1</title>
<style>
:root{--ink:#2b2622;--muted:#7d746b;--accent:#6d28d9;--line:#e8e2da;--soft:#f6f2ec}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:"Segoe UI",Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;height:100%}
#view{position:relative;min-height:440px;background:#1d2747}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.bar button{pointer-events:auto}
button{font-weight:600;font-size:13px;font-family:inherit;border:1px solid rgba(255,255,255,.6);color:var(--ink);background:rgba(255,255,255,.92);border-radius:8px;padding:7px 12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hint{position:absolute;bottom:12px;left:12px;font-size:12px;color:#e8e6f5;background:rgba(20,22,40,.55);padding:4px 10px;border-radius:6px}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#e8e6f5;font-size:14px}
aside{border-left:1px solid var(--line);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px;background:#fff}
aside h2{margin:0;font-size:20px}
aside .sub{margin:0;color:var(--muted);font-size:13px}
.total{font-size:28px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right}
tr.room-row{cursor:pointer}
tr.room-row:hover td{background:var(--soft)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.1)}
.note{font-size:12px;color:var(--muted);margin:0}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="loading">Loading the villa…</div>
    <div class="bar">
      <button data-view="outside" class="on" type="button">Outside</button>
      <button data-view="upper" type="button">Upper floor</button>
      <button data-view="ground" type="button">Ground floor</button>
      <button id="structure" type="button" aria-pressed="false">Structure</button>
      <button id="back" type="button" hidden>← Whole villa</button>
    </div>
    <div class="hint">Drag to rotate · scroll or pinch to zoom · click a room to go inside</div>
  </div>
  <aside id="panel"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
// =====================================================================
// Data: materials and costs per room (dummy; overridden by rooms.csv)
// =====================================================================
const FALLBACK_CSV = `room,item,quantity,unit,unit_price_sar
Structure,Foundation concrete,85,m3,450
Structure,Reinforcement steel,14,t,3200
Structure,Columns and beams,40,m3,520
Structure,Block walls,420,m2,95
Structure,Roof slab,190,m2,310
Living room,Porcelain floor tiles,63,m2,180
Living room,Wall plaster and paint,110,m2,45
Living room,Gypsum ceiling,63,m2,85
Living room,Windows (double glazed),4,pcs,2800
Living room,Lighting and electrics,1,set,9500
Kitchen,Floor tiles,49,m2,160
Kitchen,Cabinets,9,m,2400
Kitchen,Quartz countertop,7,m,1350
Kitchen,Appliances,1,set,26000
Kitchen,Wall tiles,22,m2,140
Guest bathroom,Floor and wall tiles,38,m2,170
Guest bathroom,Sanitary ware,1,set,7800
Guest bathroom,Plumbing,1,set,5200
Master bedroom,Wood flooring,96,m2,210
Master bedroom,Wall plaster and paint,120,m2,45
Master bedroom,Built-in wardrobe,4,m,3100
Master bedroom,Windows (double glazed),3,pcs,2800
Bedroom 2,Wood flooring,56,m2,210
Bedroom 2,Wall plaster and paint,86,m2,45
Bedroom 2,Built-in wardrobe,2.5,m,3100
Bathroom,Floor and wall tiles,46,m2,170
Bathroom,Bathtub and sanitary ware,1,set,12500
Bathroom,Plumbing,1,set,6100`;

// Plan in metres. x across (0–16), z from back (0) to front (12). Floor 0 = ground.
// glass: sides that are full-height sliding glass. win: windows on outside walls, as [side, position along wall, kind]
const ROOMS = [
  { name: "Living room", floor: 0, x: 0, z: 0, w: 9, d: 12, kind: "living", glass: ["front"], win: [["back", 3], ["left", 4], ["left", 8.5]], swatch: "#d9d2c6" },
  { name: "Kitchen", floor: 0, x: 9, z: 0, w: 7, d: 7, kind: "kitchen", win: [["back", 3.5], ["right", 3.5]], swatch: "#e8e4dc" },
  { name: "Guest bathroom", floor: 0, x: 12, z: 7, w: 4, d: 5, kind: "bath", win: [["front", 2, "small"]], swatch: "#cfd8dc" },
  { name: "Master bedroom", floor: 1, x: 0, z: 0, w: 8, d: 12, kind: "bed", glass: ["front"], win: [["back", 4]], white: ["left"], swatch: "#b98d63" },
  { name: "Bedroom 2", floor: 1, x: 8, z: 0, w: 8, d: 7, kind: "bed2", win: [["back", 4], ["right", 3.5]], swatch: "#c49a70" },
  { name: "Bathroom", floor: 1, x: 12, z: 7, w: 4, d: 5, kind: "bathtub", win: [["front", 2, "small"], ["right", 2.5, "small"]], swatch: "#cfd8dc" },
];
const FH = 3.2, WALL = 0.2, W = 16, D = 12, CANT = 2.6;   // floor height, wall thickness, plan size, balcony depth

let ITEMS = [];
function parseCsv(text) {
  return text.replace(/^﻿/, "").trim().split(/\r?\n/).slice(1).map((line) => {
    const c = line.split(",").map((s) => s.trim());
    return { room: c[0], item: c[1], qty: +c[2] || 0, unit: c[3] || "", price: +c[4] || 0 };
  }).filter((r) => r.room && r.item);
}
const sar = (n) => "SAR " + Math.round(n).toLocaleString();
const costOf = (room) => ITEMS.filter((i) => i.room === room).reduce((s, i) => s + i.qty * i.price, 0);
const roomOf = (name) => ROOMS.find((r) => r.name === name);

// =====================================================================
// Renderer, camera, lighting: dusk outside, warm light inside
// =====================================================================
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);

const scene = new THREE.Scene();
const col = (hex) => new THREE.Color(hex).convertSRGBToLinear();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

// dusk sky as a vertical gradient
{
  const c = document.createElement("canvas"); c.width = 4; c.height = 512;
  const g = c.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, "#0f1a3d"); gr.addColorStop(0.45, "#2b3f7a"); gr.addColorStop(0.72, "#5f73ad"); gr.addColorStop(0.88, "#a99cbc"); gr.addColorStop(1, "#c9b39f");
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  scene.background = t;
}
scene.fog = new THREE.Fog(col(0x6e78a6), 45, 130);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 3; controls.maxDistance = 80;

scene.add(new THREE.HemisphereLight(col(0x7f95d6), col(0x2c281c), 0.38));
const dusk = new THREE.DirectionalLight(col(0xaec0ff), 0.42);
dusk.position.set(-22, 28, -14);
dusk.castShadow = true;
dusk.shadow.mapSize.set(2048, 2048);
dusk.shadow.bias = -0.0004;
Object.assign(dusk.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 120 });
scene.add(dusk);

// =====================================================================
// Procedural textures (drawn on canvases, so there is nothing to download)
// =====================================================================
function rng(seed) { return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296); }
function canvasTex(size, draw, seed = 1, srgb = true) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  draw(c.getContext("2d"), size, rng(seed));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const grey = (v, a = 1) => `rgba(${v},${v},${v},${a})`;
// stacked stone cladding: colour map and a matching bump map
function stoneDraw(bump) {
  return (g, s, r) => {
    g.fillStyle = bump ? "#000" : "#1e1d1b"; g.fillRect(0, 0, s, s);
    for (let y = 0; y < s;) {
      const h = 8 + r() * 20;
      for (let x = -r() * 80; x < s;) {
        const len = 30 + r() * 150, v = 52 + r() * 62, warm = r() * 10;
        if (bump) g.fillStyle = grey(140 + r() * 100);
        else g.fillStyle = `rgb(${v + warm},${v + warm * 0.6},${v})`;
        g.fillRect(x + 1.5, y + 1.5, len - 3, h - 3);
        // speckle and edge shading for texture
        for (let k = 0; k < len * h * 0.02; k++) { g.fillStyle = bump ? grey(100 + r() * 155, 0.6) : grey(r() * 255, 0.08); g.fillRect(x + r() * len, y + r() * h, 2, 1.5); }
        x += len;
      }
      y += h;
    }
  };
}
const TEX = {
  stone: canvasTex(512, stoneDraw(false), 7), stoneBump: canvasTex(512, stoneDraw(true), 7, false),
  paving: canvasTex(512, (g, s, r) => {
    g.fillStyle = "#d8d2c8"; g.fillRect(0, 0, s, s);
    const n = 4, t = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const v = 205 + r() * 18; g.fillStyle = `rgb(${v},${v - 4},${v - 10})`; g.fillRect(i * t + 2, j * t + 2, t - 4, t - 4);
      for (let k = 0; k < 400; k++) { g.fillStyle = grey(r() * 255, 0.05); g.fillRect(i * t + r() * t, j * t + r() * t, 2, 2); }
    }
  }, 3),
  deck: canvasTex(512, (g, s, r) => {
    const n = 8, h = s / n;
    for (let i = 0; i < n; i++) {
      const b = 110 + r() * 40; g.fillStyle = `rgb(${b},${b * 0.66},${b * 0.42})`; g.fillRect(0, i * h, s, h);
      for (let k = 0; k < 18; k++) { g.strokeStyle = `rgba(60,35,20,${0.08 + r() * 0.12})`; g.lineWidth = 1; g.beginPath(); const y0 = i * h + r() * h; g.moveTo(0, y0); for (let x = 0; x <= s; x += 32) g.lineTo(x, y0 + Math.sin(x * 0.02 + k) * 2); g.stroke(); }
      g.fillStyle = "rgba(25,15,10,.85)"; g.fillRect(0, i * h, s, 3);
      const cut = r() * s; g.fillRect(cut, i * h, 3, h);
    }
  }, 5),
  oak: canvasTex(512, (g, s, r) => {
    const n = 10, h = s / n;
    for (let i = 0; i < n; i++) {
      const b = 175 + r() * 30; g.fillStyle = `rgb(${b},${b * 0.78},${b * 0.55})`; g.fillRect(0, i * h, s, h);
      for (let k = 0; k < 12; k++) { g.strokeStyle = `rgba(110,70,35,${0.06 + r() * 0.1})`; g.beginPath(); const y0 = i * h + r() * h; g.moveTo(0, y0); for (let x = 0; x <= s; x += 40) g.lineTo(x, y0 + Math.sin(x * 0.015 + k * 2) * 1.5); g.stroke(); }
      g.fillStyle = "rgba(70,45,25,.5)"; g.fillRect(0, i * h, s, 1.5); g.fillRect(r() * s, i * h, 1.5, h);
    }
  }, 9),
  tile: canvasTex(512, (g, s, r) => {
    g.fillStyle = "#bdb5aa"; g.fillRect(0, 0, s, s);
    const n = 2, t = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const v = 226 + r() * 10; g.fillStyle = `rgb(${v},${v - 3},${v - 8})`; g.fillRect(i * t + 1.5, j * t + 1.5, t - 3, t - 3);
      for (let k = 0; k < 6; k++) { g.strokeStyle = `rgba(150,140,130,${0.05 + r() * 0.08})`; g.lineWidth = 1 + r() * 2; g.beginPath(); g.moveTo(i * t + r() * t, j * t); g.bezierCurveTo(i * t + r() * t, j * t + t * 0.3, i * t + r() * t, j * t + t * 0.7, i * t + r() * t, j * t + t); g.stroke(); }
    }
  }, 11),
  lawn: canvasTex(256, (g, s, r) => {
    g.fillStyle = "#335b25"; g.fillRect(0, 0, s, s);
    for (let k = 0; k < 9000; k++) { const v = r(); g.fillStyle = `rgba(${40 + v * 50},${80 + v * 70},${25 + v * 30},.5)`; g.fillRect(r() * s, r() * s, 1, 2 + r() * 3); }
  }, 13),
  water: canvasTex(512, (g, s, r) => {
    g.fillStyle = "#18a9cf"; g.fillRect(0, 0, s, s);
    for (let k = 0; k < 140; k++) {
      g.strokeStyle = `rgba(200,250,255,${0.15 + r() * 0.35})`; g.lineWidth = 1 + r() * 2.5; g.beginPath();
      let x = r() * s, y = r() * s; g.moveTo(x, y);
      for (let i = 0; i < 4; i++) { x += (r() - 0.5) * 70; y += (r() - 0.5) * 70; g.quadraticCurveTo(x + (r() - 0.5) * 40, y + (r() - 0.5) * 40, x, y); }
      g.stroke();
    }
  }, 17),
  marble: canvasTex(512, (g, s, r) => {
    g.fillStyle = "#f2f0ec"; g.fillRect(0, 0, s, s);
    for (let k = 0; k < 18; k++) { g.strokeStyle = `rgba(150,145,140,${0.1 + r() * 0.25})`; g.lineWidth = 0.6 + r() * 1.8; g.beginPath(); g.moveTo(r() * s, 0); g.bezierCurveTo(r() * s, s * 0.3, r() * s, s * 0.6, r() * s, s); g.stroke(); }
  }, 19),
  fabric: canvasTex(128, (g, s, r) => {
    g.fillStyle = "#fff"; g.fillRect(0, 0, s, s);
    for (let k = 0; k < 4000; k++) { g.fillStyle = grey(200 + r() * 55, 0.4); g.fillRect(r() * s, r() * s, 1, 1); }
  }, 23),
};
TEX.stone.userData = { s: 1.4 };

// =====================================================================
// Materials and geometry helpers
// =====================================================================
const M = {};
function std(hex, o = {}) { const m = new THREE.MeshStandardMaterial({ color: col(hex), roughness: 0.8, metalness: 0, envMapIntensity: 0.35, ...o }); return m; }
function scaled(m, s) { m.userData.s = s; return m; }
M.stone = scaled(std(0xffffff, { map: TEX.stone, bumpMap: TEX.stoneBump, bumpScale: 0.035, roughness: 0.92 }), 1.4);
M.white = std(0xeceae6, { roughness: 0.8, envMapIntensity: 0.15 });
M.plaster = std(0xf3ece2, { roughness: 0.9 });
M.paving = scaled(std(0xd2cdc6, { map: TEX.paving, roughness: 0.85, envMapIntensity: 0.15 }), 2.4);
M.deck = scaled(std(0xffffff, { map: TEX.deck, roughness: 0.7 }), 1.6);
M.oak = scaled(std(0xffffff, { map: TEX.oak, roughness: 0.55, envMapIntensity: 0.5 }), 1.4);
M.tile = scaled(std(0xffffff, { map: TEX.tile, roughness: 0.25, envMapIntensity: 0.6 }), 1.2);
M.marble = scaled(std(0xffffff, { map: TEX.marble, roughness: 0.2, envMapIntensity: 0.8 }), 1.2);
M.lawn = scaled(std(0x9aa88f, { map: TEX.lawn, roughness: 1, envMapIntensity: 0.1 }), 2.5);
M.frame = std(0x2a2b2e, { metalness: 0.6, roughness: 0.35, envMapIntensity: 0.8 });
M.steel = std(0xb9bcc0, { metalness: 0.9, roughness: 0.25, envMapIntensity: 1 });
M.glass = new THREE.MeshPhysicalMaterial({ color: col(0xa9c2d0), metalness: 0, roughness: 0.05, transparent: true, opacity: 0.18, envMapIntensity: 1.6, depthWrite: false });
M.walnut = scaled(std(0x6b4a33, { map: TEX.oak, roughness: 0.5 }), 1);
M.linen = scaled(std(0xd9d0c2, { map: TEX.fabric, roughness: 0.95 }), 0.5);
M.cushion = scaled(std(0xbfb3a2, { map: TEX.fabric, roughness: 0.95 }), 0.5);
M.charcoal = scaled(std(0x4b4a4a, { map: TEX.fabric, roughness: 0.95 }), 0.5);
M.rattan = std(0xc49a5e, { roughness: 0.8 });
M.black = std(0x111214, { roughness: 0.3, envMapIntensity: 1 });
M.porcelain = std(0xfafafa, { roughness: 0.15, envMapIntensity: 0.9 });
M.concrete = std(0x9a9a98, { roughness: 0.95 });
M.leaf = std(0x3f6a2e, { roughness: 0.9, side: THREE.DoubleSide });
M.trunk = std(0x8a6f50, { roughness: 1 });
M.warmGlow = new THREE.MeshBasicMaterial({ color: col(0xffd8a0) });
M.pool = scaled(new THREE.MeshStandardMaterial({ map: TEX.water, emissive: col(0x1aa7d4), emissiveMap: TEX.water, emissiveIntensity: 0.6, roughness: 0.08, metalness: 0.1, envMapIntensity: 1.2 }), 3);
M.water = M.pool;

// a box whose texture is scaled to its real size, so stone and planks don't stretch
function boxGeo(w, h, d, s = 1) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) { const i = f * 4 + v; uv.setXY(i, (uv.getX(i) * dims[f][0]) / s, (uv.getY(i) * dims[f][1]) / s); }
  return g;
}
const RB = (w, h, d, r) => (THREE.RoundedBoxGeometry ? new THREE.RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2, h / 2, d / 2)) : new THREE.BoxGeometry(w, h, d));
function box(w, h, d, m, x, y, z, parent, o = {}) {
  const geo = o.round ? RB(w, h, d, o.round) : boxGeo(w, h, d, m.userData?.s || 1);
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = o.shadow !== false; mesh.receiveShadow = true;
  if (o.ry) mesh.rotation.y = o.ry;
  parent.add(mesh); return mesh;
}
function cyl(r1, r2, h, m, x, y, z, parent, seg = 20) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), m);
  mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh;
}
function ball(r, m, x, y, z, parent) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), m);
  mesh.position.set(x, y, z); mesh.castShadow = true; parent.add(mesh); return mesh;
}

// soft warm light washes on walls, like the uplights in the photo
const washTex = canvasTex(128, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s * 0.92, 2, s / 2, s * 0.75, s * 0.7);
  gr.addColorStop(0, "rgba(255,214,160,1)"); gr.addColorStop(0.35, "rgba(255,190,120,.45)"); gr.addColorStop(1, "rgba(255,180,110,0)");
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
washTex.wrapS = washTex.wrapT = THREE.ClampToEdgeWrapping;
const washMat = new THREE.MeshBasicMaterial({ map: washTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.85 });
function wash(x, y, z, ry, parent, w = 1.4, h = 2.8) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), washMat);
  p.position.set(x, y + h / 2, z); p.rotation.y = ry; parent.add(p);
  box(0.12, 0.06, 0.08, M.frame, x, y + 0.03, z, parent, { shadow: false });
  return p;
}

// =====================================================================
// The villa
// =====================================================================
const house = new THREE.Group();
house.position.set(-W / 2, 0, -D / 2);
scene.add(house);
const outside = new THREE.Group(); house.add(outside);
const floors = [new THREE.Group(), new THREE.Group()];
floors.forEach((g, i) => { g.position.y = i * FH; house.add(g); });
const roomGroups = {}, roomLights = [];
const fadeMats = [];   // materials made see-through in the structure view
function fading(m) { const c = m.clone(); fadeMats.push(c); return c; }
const MW = { stone: fading(M.stone), white: fading(M.white), plaster: fading(M.plaster), tileWall: fading(M.tile) };

// --- walls of one room: plaster inside, stone or white render outside, glass where noted
function sidesOf(r) {
  return [
    { id: "back", len: r.w, cx: r.x + r.w / 2, cz: r.z, along: "x", ext: r.z === 0, out: [0, -1] },
    { id: "front", len: r.w, cx: r.x + r.w / 2, cz: r.z + r.d, along: "x", ext: r.z + r.d === D, out: [0, 1] },
    { id: "left", len: r.d, cx: r.x, cz: r.z + r.d / 2, along: "z", ext: r.x === 0, out: [-1, 0] },

// palms, cypresses and a back wall
function palm(x, z, h, parent) {
  const p = new THREE.Group(); p.position.set(x, 0, z); parent.add(p);
  let top = new THREE.Vector3();
  for (let i = 0; i < 12; i++) {
    const seg = cyl(0.26 - i * 0.01, 0.3 - i * 0.01, h / 12, M.trunk, Math.sin(i * 0.25) * 0.25, (i + 0.5) * (h / 12), 0, p, 10);
    seg.rotation.z = 0.03; top.set(seg.position.x, (i + 1) * (h / 12), 0);
  }
  const frondTex = canvasTex(256, (g, s) => {
    g.clearRect(0, 0, s, s); g.strokeStyle = "#3d6d2a"; g.lineWidth = 3; g.beginPath(); g.moveTo(s / 2, 0); g.lineTo(s / 2, s); g.stroke();
    for (let y = 8; y < s; y += 7) { const l = (s / 2) * Math.sin((Math.PI * y) / s) * 0.95; g.lineWidth = 3; g.strokeStyle = y % 14 ? "#4f8233" : "#5d9440"; g.beginPath(); g.moveTo(s / 2, y); g.lineTo(s / 2 - l, y + 14); g.moveTo(s / 2, y); g.lineTo(s / 2 + l, y + 14); g.stroke(); }
  }, 1);
  frondTex.wrapS = frondTex.wrapT = THREE.ClampToEdgeWrapping;
  const fm = new THREE.MeshStandardMaterial({ map: frondTex, alphaTest: 0.4, side: THREE.DoubleSide, roughness: 0.9, envMapIntensity: 0.3 });
  for (let i = 0; i < 14; i++) {
    const geo = new THREE.PlaneGeometry(1, 3.2, 1, 8); const pos = geo.attributes.position;
    for (let v = 0; v < pos.count; v++) { const yy = pos.getY(v) + 1.6; pos.setZ(v, -0.12 * yy * yy); }
    geo.translate(0, 1.6, 0);
    const f = new THREE.Mesh(geo, fm); f.castShadow = true;
    f.position.copy(top); f.rotation.order = "YXZ"; f.rotation.y = (i / 14) * Math.PI * 2; f.rotation.x = -0.9 + (i % 3) * 0.25;
    p.add(f);

}
palm(-13, D + 1, 6.5, outside); palm(W + 3, D + 7, 5.5, outside);
for (let x = -14; x <= W + 6; x += 2.1) { const c = new THREE.Mesh(new THREE.ConeGeometry(0.55, 3.4, 10), std(0x2f4f2a, { roughness: 1 })); c.position.set(x, 1.7, -3.8); c.castShadow = true; outside.add(c); }
box(W + 22, 1.8, 0.3, M.white, W / 2 - 4, 0.9, -5, outside);
// wall washers on the stone, and path bollards
wash(10.5, 0.06, D + 0.32, 0, stairs, 1.3, 3.0); for (const x of [13.2, 14.8]) wash(x, 0.06, D + 0.32, 0, roomGroups["Guest bathroom"], 1.3, 3.0);
wash(2, 0.06, -0.32, Math.PI, roomGroups["Living room"], 1.3, 3.0); wash(12.5, 0.06, -0.32, Math.PI, roomGroups["Kitchen"], 1.3, 3.0);
for (const [x, z] of [[10, D + CANT + 0.32], [13.5, D + CANT + 0.32]]) { /* balcony soffit glow */ const p = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.2), M.warmGlow); p.rotation.x = Math.PI / 2; p.position.set(x, FH - 0.01, z - 1.2); outside.add(p); }
for (let i = 0; i < 6; i++) { const bx = -0.8, bz = D + 1 + i * 1.6; cyl(0.06, 0.06, 0.5, M.frame, bx + 18.2, 0.25, bz - 1, outside, 8); ball(0.05, M.warmGlow, bx + 18.2, 0.52, bz - 1, outside).castShadow = false; }

// =====================================================================
// People: seated and standing figures that turn to each other and talk
// =====================================================================
const SKIN = [0xc68e6a, 0xe0b090, 0x8d5a3c, 0xf1c9a5, 0xb07a55, 0xd9a47f, 0x7a4a30];
function person(o) {
  const mm = (h) => std(h, { roughness: 0.85, map: TEX.fabric });
  const skin = std(o.skin, { roughness: 0.6 }), top = mm(o.top), bottom = mm(o.bottom), hair = std(o.hair, { roughness: 0.7 }), shoe = std(0x2b2523);
  const g = new THREE.Group();
  const seat = o.seat ?? 0, hipY = o.stand ? 0.95 : seat + 0.08;
  // legs
  for (const s of [-1, 1]) {
    if (o.stand) {
      cyl(0.075, 0.06, 0.48, bottom, s * 0.1, hipY - 0.24, 0, g, 10); cyl(0.055, 0.045, 0.45, bottom, s * 0.1, hipY - 0.7, 0, g, 10);
      box(0.1, 0.07, 0.25, shoe, s * 0.1, 0.035, 0.05, g, { round: 0.03 });
    } else {
      const th = cyl(0.075, 0.065, 0.44, bottom, s * 0.1, hipY, 0.2, g, 10); th.rotation.x = Math.PI / 2;
      cyl(0.055, 0.045, seat + 0.02, bottom, s * 0.1, (hipY) / 2, 0.42, g, 10);
      box(0.1, 0.07, 0.25, shoe, s * 0.1, 0.035, 0.47, g, { round: 0.03 });
    }
  }
  box(0.32, 0.16, 0.22, bottom, 0, hipY, 0, g, { round: 0.07 });
  // torso, shoulders, neck, head
  const torso = new THREE.Group(); torso.position.y = hipY + 0.06; g.add(torso);
  const chest = cyl(0.17, 0.14, 0.5, top, 0, 0.25, 0, torso, 14); chest.scale.z = 0.72;
  ball(0.07, top, -0.17, 0.47, 0, torso).scale.set(1, 0.8, 1); ball(0.07, top, 0.17, 0.47, 0, torso).scale.set(1, 0.8, 1);
  cyl(0.045, 0.05, 0.08, skin, 0, 0.53, 0, torso, 10);
  const head = new THREE.Group(); head.position.y = 0.58; torso.add(head);
  const skull = ball(0.105, skin, 0, 0.1, 0.005, head); skull.scale.set(0.92, 1.12, 1);
  ball(0.03, skin, 0, 0.085, 0.1, head).scale.set(0.6, 0.9, 0.7);                          // nose
  const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.112, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hair);
  hairCap.position.set(0, 0.115, -0.008); hairCap.scale.set(0.95, 1.1, 1.05); hairCap.rotation.x = -0.25; head.add(hairCap);
  if (o.long) { const h2 = box(0.2, 0.28, 0.08, hair, 0, 0.02, -0.07, head, { round: 0.04 }); h2.castShadow = true; }
  for (const s of [-1, 1]) { const e = ball(0.012, std(0x1b1b1b), s * 0.035, 0.115, 0.095, head); e.castShadow = false; }
  // arms with shoulder and elbow joints for gestures
  const arms = [-1, 1].map((s) => {
    const sh = new THREE.Group(); sh.position.set(s * 0.21, 0.45, 0); torso.add(sh);
    cyl(0.045, 0.04, 0.28, top, 0, -0.14, 0, sh, 10);
    const el = new THREE.Group(); el.position.y = -0.28; sh.add(el);
    cyl(0.038, 0.032, 0.25, skin, 0, -0.125, 0, el, 10);
    ball(0.042, skin, 0, -0.27, 0, el);
    sh.rotation.z = s * 0.12;
    return { sh, el };
  });
  // resting pose: hands on the lap when seated, at the sides when standing
  arms.forEach((a, i) => { a.sh.rotation.x = o.stand ? -0.15 : -0.35; a.el.rotation.x = o.stand ? -0.5 : -1.15; });
  g.traverse((m) => { if (m.isMesh) m.castShadow = true; });
  return { g, head, torso, arms, phase: Math.random() * 10 };
}
// speech bubble with animated dots
function bubbleTex(n) {
  return canvasTex(128, (g, s) => {
    g.clearRect(0, 0, s, s);
    g.fillStyle = "rgba(255,255,255,.95)"; g.beginPath(); g.moveTo(24, 20); g.arcTo(116, 20, 116, 84, 18); g.arcTo(116, 84, 12, 84, 18); g.lineTo(48, 84); g.lineTo(34, 104); g.lineTo(38, 84); g.arcTo(12, 84, 12, 20, 18); g.arcTo(12, 20, 116, 20, 18); g.fill();
    for (let i = 0; i < 3; i++) { g.fillStyle = i < n ? "#6d28d9" : "#d6ccf2"; g.beginPath(); g.arc(42 + i * 22, 52, 8, 0, Math.PI * 2); g.fill(); }
  });
}
const BUBBLES = [1, 2, 3].map(bubbleTex);
const people = [], chats = [];
function seat(o, x, y, z, ry, parent) { const p = person(o); p.g.position.set(x, y, z); p.g.rotation.y = ry; parent.add(p.g); people.push(p); return p; }
function chat(a, b) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: BUBBLES[0], depthTest: false, transparent: true }));
  s.scale.set(0.42, 0.42, 1); s.renderOrder = 10; s.visible = false;
  a.g.parent.add(s);
  chats.push({ a, b, talker: 0, until: 0, s });
}
const LR = roomGroups["Living room"], KI = roomGroups["Kitchen"], FL = 0.34;
// two on the sofa, two at the dining table, one cooking in the kitchen, two out on the deck
const p1 = seat({ skin: SKIN[0], top: 0x5b6f8a, bottom: 0x2e3440, hair: 0x1d1611, seat: 0.42 }, 3.4, FL, 8.45, Math.PI - 0.35, LR);
const p2 = seat({ skin: SKIN[3], top: 0xd8b4a0, bottom: 0x47423d, hair: 0x5a3a22, long: true, seat: 0.42 }, 1.95, FL, 7.0, Math.PI / 2 + 0.25, LR);
const p3 = seat({ skin: SKIN[2], top: 0xe9e4da, bottom: 0x3a4a5e, hair: 0x111111, seat: 0.47 }, 5.9, FL, 9.85, 0, LR);
const p4 = seat({ skin: SKIN[5], top: 0x8a3b3b, bottom: 0x2d2d2d, hair: 0x2a1b12, long: true, seat: 0.47 }, 7.3, FL, 11.35, Math.PI, LR);
const p5 = seat({ skin: SKIN[1], top: 0x7c8b6a, bottom: 0x403a34, hair: 0x3b2a1e, stand: true }, 12.0, FL, 3.2, 0.2, KI);
const p6 = seat({ skin: SKIN[4], top: 0xf2efe8, bottom: 0xc6b9a3, hair: 0x1a1410, seat: 0.5 }, -1.0, 0, 1.45, Math.PI, lounge);
const p7 = seat({ skin: SKIN[6], top: 0x2f4858, bottom: 0xe8e1d4, hair: 0x0e0b09, long: true, seat: 0.5 }, -2.55, 0, -0.2, Math.PI / 2, lounge);
chat(p1, p2); chat(p3, p4); chat(p6, p7);

function animatePeople(t, dt) {
  const look = new THREE.Vector3(), here = new THREE.Vector3(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (const c of chats) {
    if (t > c.until) { c.talker = Math.random() < 0.55 ? 1 - c.talker : c.talker; c.until = t + 2.5 + Math.random() * 3.5; }
    const [sp, li] = c.talker ? [c.b, c.a] : [c.a, c.b];
    for (const [p, other, speaking] of [[sp, li, true], [li, sp, false]]) {
      // turn the head toward the other person (limited, like a real neck)
      other.head.getWorldPosition(look); p.head.getWorldPosition(here);
      p.g.getWorldQuaternion(q);
      const dir = look.sub(here).applyQuaternion(q.invert());
      const yaw = THREE.MathUtils.clamp(Math.atan2(dir.x, dir.z), -1.1, 1.1);
      p.head.rotation.y += (yaw - p.head.rotation.y) * Math.min(1, dt * 3);
      p.head.rotation.x = speaking ? Math.sin(t * 7 + p.phase) * 0.05 : Math.sin(t * 1.6 + p.phase) * 0.08 - 0.03;
      p.torso.rotation.y = p.head.rotation.y * 0.25;
      const arm = p.arms[1];
      const restX = p === p5 ? -0.15 : -0.35, restE = p === p5 ? -0.5 : -1.15;
      const gx = speaking ? restX - 0.35 + Math.sin(t * 2.3 + p.phase) * 0.3 : restX;
      const ge = speaking ? restE - 0.35 + Math.sin(t * 3.1 + p.phase) * 0.35 : restE;
      arm.sh.rotation.x += (gx - arm.sh.rotation.x) * Math.min(1, dt * 4);
      arm.el.rotation.x += (ge - arm.el.rotation.x) * Math.min(1, dt * 4);
    }
    // the bubble floats above whoever is talking
    sp.head.getWorldPosition(here); c.s.parent.worldToLocal(here);
    c.s.position.copy(here).add(new THREE.Vector3(0, 0.42, 0));
    c.s.material.map = BUBBLES[Math.floor(t * 2.5) % 3];
    c.s.visible = c.a.g.parent.visible && isShown(c.a.g);
  }
  for (const p of people) p.torso.scale.y = 1 + Math.sin(t * 1.7 + p.phase) * 0.008;   // breathing
  // the cook stirs at the hob
  p5.arms[0].el.rotation.x = -1.3 + Math.sin(t * 4) * 0.25;
}
function isShown(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }

// =====================================================================
// Views, room focus and the side panel
// =====================================================================
let mode = "outside", focusRoom = null, showStructure = false;
const VIEWS = {
  outside: [new THREE.Vector3(-21, 5.5, 26), new THREE.Vector3(-1, 3.2, 3)],
  upper: [new THREE.Vector3(16, 24, 24), new THREE.Vector3(0, FH, 1)],
  ground: [new THREE.Vector3(16, 20, 22), new THREE.Vector3(0, 0, 1)],
};
const goal = { pos: VIEWS.outside[0].clone(), target: VIEWS.outside[1].clone() };
camera.position.copy(goal.pos); controls.target.copy(goal.target);
let flying = 0;
function flyTo(pos, target) { goal.pos.copy(pos); goal.target.copy(target); flying = 1; }

function apply() {
  const r = focusRoom ? roomOf(focusRoom) : null;
  roof.visible = mode === "outside" && !r;
  floors[1].visible = r ? r.floor === 1 : mode !== "ground";
  floors[0].visible = !(r && r.floor === 1);
  ROOMS.forEach((rr) => { roomGroups[rr.name].visible = !r || rr.name === focusRoom; });
  stairs.visible = hall.visible = balcony.visible = !r;
  upperSlab.visible = !r || r.floor === 1;
  structure.visible = showStructure;
  fadeMats.forEach((m) => { m.transparent = showStructure; m.opacity = showStructure ? 0.15 : 1; m.depthWrite = !showStructure; m.needsUpdate = true; });
  document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("on", !r && b.dataset.view === mode));
  document.getElementById("back").hidden = !r;
  renderPanel();
}
function setMode(m) { mode = m; focusRoom = null; flyTo(...VIEWS[m]); apply(); }
function enterRoom(name) {
  const r = roomOf(name); focusRoom = name;
  const c = new THREE.Vector3(r.x + r.w / 2 - W / 2, r.floor * FH + 1.0, r.z + r.d / 2 - D / 2);
  const reach = Math.max(r.w, r.d);
  flyTo(c.clone().add(new THREE.Vector3(reach * 0.5, reach * 0.75 + 1.8, reach * 0.85)), c);
  apply();
}
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(Object.values(roomGroups).filter(isShown), true).find((h) => h.object.material !== M.glass);
  if (!hit) return;
  let o = hit.object; while (o && !o.userData.room) o = o.parent;
  if (o && o.userData.room !== focusRoom) enterRoom(o.userData.room);
});
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.view)));
document.getElementById("back").addEventListener("click", () => setMode(mode === "outside" ? "upper" : mode));
document.getElementById("structure").addEventListener("click", (e) => {
  showStructure = !showStructure;
  e.currentTarget.classList.toggle("on", showStructure); e.currentTarget.setAttribute("aria-pressed", showStructure);
  apply();
});

const panel = document.getElementById("panel");
function renderPanel() {
  const total = ITEMS.reduce((s, i) => s + i.qty * i.price, 0) || 1;
  const name = focusRoom || (showStructure ? "Structure" : null);
  if (name) {
    const r = roomOf(name), rows = ITEMS.filter((i) => i.room === name);
    panel.innerHTML = `<div><h2>${name}</h2><p class="sub">${r ? (r.floor ? "Upper floor" : "Ground floor") + " · " + r.w + " × " + r.d + " m" : "Foundation, columns, beams, walls and slabs"}</p></div>
      <div class="total">${sar(costOf(name))}</div>
      <table><thead><tr><th>Material</th><th class="num">Qty</th><th class="num">Cost</th></tr></thead><tbody>
      ${rows.map((i) => `<tr><td>${i.item}</td><td class="num">${i.qty} ${i.unit}<br><span class="sub">× ${i.price.toLocaleString()}</span></td><td class="num">${sar(i.qty * i.price)}</td></tr>`).join("")}
      </tbody></table>
      <p class="note">${((100 * costOf(name)) / total).toFixed(1)}% of the villa's total ${sar(total)}.</p>`;
    return;
  }
  const names = ["Structure", ...ROOMS.map((rr) => rr.name)];
  panel.innerHTML = `<div><h2>Two-storey villa</h2><p class="sub">16 × 12 m plus a ${CANT} m balcony · ${ROOMS.length} rooms · dummy prices</p></div>
    <div class="total">${sar(total)}</div>
    <table><thead><tr><th>Part</th><th class="num">Cost</th><th class="num">Share</th></tr></thead><tbody>
    ${names.map((n) => { const rr = roomOf(n); return `<tr class="room-row" data-room="${n}"><td><span class="swatch" style="background:${rr ? rr.swatch : "#9a9a9a"}"></span>${n}</td><td class="num">${sar(costOf(n))}</td><td class="num">${((100 * costOf(n)) / total).toFixed(0)}%</td></tr>`; }).join("")}
    </tbody></table>
    <p class="note">Click a row or a room to zoom in. Prices come from rooms.csv.</p>`;
  panel.querySelectorAll(".room-row").forEach((tr) => tr.addEventListener("click", () => {
    const n = tr.dataset.room;
    if (n === "Structure") { if (!showStructure) document.getElementById("structure").click(); return; }
    enterRoom(n);
  }));
}

// =====================================================================
// Loop
// =====================================================================
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
controls.addEventListener("start", () => (flying = 0));
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (flying) { camera.position.lerp(goal.pos, 0.07); controls.target.lerp(goal.target, 0.07); if (camera.position.distanceTo(goal.pos) < 0.05) flying = 0; }
  TEX.water.offset.set(t * 0.012, t * 0.008);
  lanternLight.intensity = 0.85 + Math.sin(t * 9) * 0.05 + Math.sin(t * 23) * 0.03;
  animatePeople(t, dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
ITEMS = parseCsv(FALLBACK_CSV);
apply(); resize(); tick();
document.getElementById("loading").remove();
fetch("rooms.csv?v=" + Date.now(), { cache: "no-store" })
  .then((r) => (r.ok ? r.text() : null))
  .then((t) => { if (t) { const rows = parseCsv(t); if (rows.length) { ITEMS = rows; renderPanel(); } } })
  .catch(() => {});
</script>
