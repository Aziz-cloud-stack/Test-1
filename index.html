<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 1</title>
<style>
html,body{margin:0;background:#fff;font-family:"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px;text-align:center}
#art svg{width:100%;height:auto;display:block;cursor:grab;touch-action:pan-y;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#art svg.dragging{cursor:grabbing}
.band{outline:none;transition:opacity .25s,filter .25s}
.label{transition:opacity .25s;cursor:pointer}
svg.focus .band:not(.on),svg.focus .label:not(.on){opacity:.35}
.band.on{filter:brightness(1.12) drop-shadow(0 0 8px rgba(124,58,237,.45))}
.label.on text{font-size:22px}
#readout{height:40px;margin-top:4px;font-size:28px;font-weight:700;color:#6d28d9}
#readout span{font-size:16px;font-weight:600;color:#7a7090;margin-left:8px}
.hint{margin:0;color:#7a7090;font-size:13px}
#art svg:focus{outline:none}
#art svg:focus-visible{outline:2px solid #6d28d9;outline-offset:4px;border-radius:12px}
</style>
</head>
<body>
<main>
<div id="art"></div>
<div id="readout" aria-live="polite"></div>
<p class="hint">Drag to rotate · hover or tap a section · arrow keys work too</p>
</main>
<script>
// Numbers used if numbers.csv can't be read. Top floor first.
const FALLBACK = [20, 40, 80, 80, 40, 20];
const DATA_FILE = "numbers.csv";

const W = 560, CX = 250, LX = 440, S0 = 92;   // S0: half-width of the ground floor
const f = (n) => n.toFixed(1);
const unit = (a) => { const l = Math.hypot(...a); return a.map((c) => c / l); };
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const LIGHT = unit([-0.55, -0.6, 0.7]);   // fixed to the viewer, so the walls catch the light as it turns

let COUNTS = FALLBACK.slice();
let geo = null;
let yaw = 0.5, tilt = 18;       // radians, degrees
let pinned = null, hover = null;

// Each number is one section of the tower; its height is proportional to the number.
// Sections step in a little as they go up, like a setback skyscraper.
function setup(counts) {
  const total = counts.reduce((a, b) => a + b, 0), n = counts.length;
  const K = 380 / total;
  const secs = [];
  let z = 0;
  for (let k = n - 1; k >= 0; k--) {             // build from the ground up; counts[0] is the top
    const h = counts[k] * K, up = n - 1 - k;
    const s = S0 * Math.max(0.5, 1 - 0.075 * up);
    secs[k] = { z0: z, z1: z + h, s };
    z += h;
  }
  geo = { counts, total, secs, height: z };
}

function frame() {
  const { counts, secs, height } = geo;
  const E = (tilt * Math.PI) / 180, cE = Math.cos(E), sE = Math.sin(E);
  const BASE = 60 + (height + 34) * cE;           // screen y of ground level at the centre
  const proj = ([x, y, z]) => [CX + x, BASE - z * cE - y * sE];
  const view = [0, -cE, sE];
  const pt = (p) => { const q = proj(p); return f(q[0]) + "," + f(q[1]); };
  const poly = (pts) => pts.map(pt).join(" ");
  // the four corners of a square of half-width s, turned by yaw
  const cornersOf = (s) => [0, 1, 2, 3].map((k) => { const a = yaw + Math.PI / 4 + (k * Math.PI) / 2; return [s * Math.SQRT2 * Math.cos(a), s * Math.SQRT2 * Math.sin(a)]; });
  const shadeOf = (nrm, base) => Math.min(1, base + Math.max(0, dot(nrm, LIGHT)) * 0.65) - 0.5;
  const tint = (t) => `fill="${t > 0 ? "#fff" : "#1a0638"}" fill-opacity="${Math.abs(t * 0.9).toFixed(2)}"`;

  // plaza the tower stands on
  const P = cornersOf(S0 + 26);
  let plaza = `<polygon points="${poly(P.map(([x, y]) => [x, y, 0]))}" fill="#f1ebfd" stroke="#ddd0f7" stroke-width="1"/>`;
  for (let k = 0; k < 4; k++) {
    const a = P[k], c = P[(k + 1) % 4], nrm = unit([c[1] - a[1], -(c[0] - a[0]), 0]);
    if (dot(nrm, view) > 0) plaza += `<polygon points="${poly([[a[0], a[1], 0], [c[0], c[1], 0], [c[0], c[1], -6], [a[0], a[1], -6]])}" fill="#e2d6f8"/>`;
  }

  let tower = "", labels = "", lastY = -1e9;
  const active = hover ?? pinned;
  // draw from the ground up so each section sits on the one below
  for (let b = counts.length - 1; b >= 0; b--) {
    const { z0, z1, s } = secs[b];
    const C = cornersOf(s);
    let g = "";
    for (let k = 0; k < 4; k++) {
      const a = C[k], c = C[(k + 1) % 4];
      const nrm = unit([c[1] - a[1], -(c[0] - a[0]), 0]);
      const facing = dot(nrm, view);
      if (facing <= 0) continue;
      const t = shadeOf(nrm, 0.25);
      const wall = [[a[0], a[1], z0], [c[0], c[1], z0], [c[0], c[1], z1], [a[0], a[1], z1]];
      g += `<polygon points="${poly(wall)}" fill="url(#gg)"/><polygon points="${poly(wall)}" ${tint(t)} stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>`;
      // windows: a grid of glass panes on each visible wall
      const h = z1 - z0, cols = Math.max(3, Math.round((2 * s) / 26)), rows = Math.max(1, Math.floor((h - 6) / 15));
      const at = (u, z) => [a[0] + (c[0] - a[0]) * u, a[1] + (c[1] - a[1]) * u, z];
      const glass = 0.18 + 0.32 * Math.max(0, dot(nrm, LIGHT));
      let win = "";
      for (let r = 0; r < rows; r++) {
        const zb = z0 + 5 + (r * (h - 8)) / rows, zt = zb + ((h - 8) / rows) * 0.62;
        for (let q = 0; q < cols; q++) {
          // the ground floor's middle bay on wall 0 is the entrance
          if (b === counts.length - 1 && k === 0 && r === 0 && q === Math.floor(cols / 2)) continue;
          const u0 = (q + 0.2) / cols, u1 = (q + 0.8) / cols;
          win += `<polygon points="${poly([at(u0, zb), at(u1, zb), at(u1, zt), at(u0, zt)])}"/>`;
        }
      }
      g += `<g fill="#ffffff" fill-opacity="${glass.toFixed(2)}">${win}</g>`;
      if (b === counts.length - 1 && k === 0) {
        const q = Math.floor(cols / 2), u0 = (q + 0.12) / cols, u1 = (q + 0.88) / cols, zt = Math.min(z0 + 20, z1 - 4);
        g += `<polygon points="${poly([at(u0, z0), at(u1, z0), at(u1, zt), at(u0, zt)])}" fill="#2a0b5e" fill-opacity=".75"/>`;
        g += `<polygon points="${poly([at(u0 - 0.04, zt + 1), at(u1 + 0.04, zt + 1), at(u1 + 0.04, zt + 3.5), at(u0 - 0.04, zt + 3.5)])}" fill="#fff" fill-opacity=".8"/>`;
      }
    }
    // roof / ledge: the top of this section, seen from above
    g += `<polygon points="${poly(C.map(([x, y]) => [x, y, z1]))}" fill="#efe6ff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>`;
    if (b === 0) {
      // roof details on the top section: a plant room and an antenna
      const r = cornersOf(s * 0.42), rz = z1 + 12;
      for (let k = 0; k < 4; k++) {
        const a = r[k], c = r[(k + 1) % 4], nrm = unit([c[1] - a[1], -(c[0] - a[0]), 0]);
        if (dot(nrm, view) > 0) g += `<polygon points="${poly([[a[0], a[1], z1], [c[0], c[1], z1], [c[0], c[1], rz], [a[0], a[1], rz]])}" fill="url(#gg)"/><polygon points="${poly([[a[0], a[1], z1], [c[0], c[1], z1], [c[0], c[1], rz], [a[0], a[1], rz]])}" ${tint(shadeOf(nrm, 0.3))}/>`;
      }
      g += `<polygon points="${poly(r.map(([x, y]) => [x, y, rz]))}" fill="#f5efff" stroke="#fff" stroke-width="1"/>`;
      const base = proj([0, 0, rz]), tip = proj([0, 0, rz + 34]);
      g += `<line x1="${f(base[0])}" y1="${f(base[1])}" x2="${f(tip[0])}" y2="${f(tip[1])}" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/><circle cx="${f(tip[0])}" cy="${f(tip[1])}" r="3" fill="#f0abfc"/>`;
    }
    const on = b === active ? " on" : "";
    tower += `<g class="band${on}" data-i="${b}">${g}</g>`;
    // pointer from the section's right-hand edge at mid height
    const zm = (z0 + z1) / 2;
    let mx = -1e9, my = 0;
    for (const [x, y] of C) { const p = proj([x, y, zm]); if (p[0] > mx) { mx = p[0]; my = p[1]; } }
    labels = `<g class="label${on}" data-i="${b}" data-y="${f(my)}" data-x="${f(mx)}"></g>` + labels;
  }
  // lay out labels top to bottom, at least 24px apart
  const tmp = document.createElement("div");
  tmp.innerHTML = `<svg>${labels}</svg>`;
  let html = "";
  [...tmp.querySelectorAll("g")].forEach((el) => {
    const i = +el.dataset.i, mx = +el.dataset.x, my = +el.dataset.y, on = el.classList.contains("on") ? " on" : "";
    const ly = Math.max(my, lastY + 24); lastY = ly;
    html += `<g class="label${on}" data-i="${i}"><path d="M${f(mx + 8)} ${f(my)}H${LX - 26}L${LX - 10} ${f(ly)}" fill="none" stroke="#c9bde6"/><circle cx="${f(mx + 8)}" cy="${f(my)}" r="2.2" fill="#6d28d9"/><text x="${LX}" y="${f(ly + 6)}" font-size="18" font-weight="700" fill="#6d28d9">${counts[i]}</text></g>`;
  });
  const topY = proj([0, 0, height])[1], groundY = proj([0, 0, 0])[1];
  const gg = document.getElementById("gg");
  gg.setAttribute("y1", f(topY)); gg.setAttribute("y2", f(groundY));
  const sh = document.getElementById("shadow");
  sh.setAttribute("cx", f(CX)); sh.setAttribute("cy", f(groundY + 10));
  sh.setAttribute("rx", "170"); sh.setAttribute("ry", f(10 + 30 * sE));
  document.getElementById("gem").innerHTML = plaza + tower;
  document.getElementById("labels").innerHTML = html;
  svg.classList.toggle("focus", active !== null);
  const H = Math.ceil(Math.max(groundY + (S0 + 26) * Math.SQRT2 * sE + 30, lastY + 30));
  if (svg.getAttribute("data-h") !== String(H)) { svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("data-h", H); }
}

const art = document.getElementById("art"), out = document.getElementById("readout");
art.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} 600" tabindex="0" role="img" aria-label="Purple building with stacked sections, one per number. Drag or use the arrow keys to rotate it.">
<defs><linearGradient id="gg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="500"><stop offset="0" stop-color="#f0abfc"/><stop offset=".35" stop-color="#c084fc"/><stop offset=".62" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b0d8c"/></linearGradient>
<radialGradient id="sh"><stop offset="0" stop-color="#3b1a7a" stop-opacity=".22"/><stop offset="1" stop-color="#3b1a7a" stop-opacity="0"/></radialGradient></defs>
<ellipse id="shadow" rx="170" ry="14" fill="url(#sh)"/><g id="gem"></g><g id="labels"></g></svg>`;
const svg = art.querySelector("svg");

// draw one frame and update the readout
function render() {
  frame();
  const active = hover ?? pinned;
  out.innerHTML = active === null ? "" : geo.counts[active] + "<span>" + ((100 * geo.counts[active]) / geo.total).toFixed(1) + "% of " + geo.total + "</span>";
}

// ---- motion: idle spin, drag with momentum ----
const still = matchMedia("(prefers-reduced-motion: reduce)");
let spin = !still.matches, vel = 0, last = 0, raf = 0, idleTimer = 0;
function loop(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60; last = now;
  if (!dragging) {
    if (Math.abs(vel) > 0.01) { yaw += vel * dt; vel *= Math.exp(-dt * 3); }
    else if (spin) yaw += 0.35 * dt;
  }
  render();
  raf = (spin || dragging || Math.abs(vel) > 0.01) ? requestAnimationFrame(loop) : 0;
}
const kick = () => { if (!raf) { last = 0; raf = requestAnimationFrame(loop); } };
const pause = () => { spin = false; clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!still.matches) { spin = true; kick(); } }, 5000); };

let dragging = false, moved = 0, sx = 0, sy = 0, lastX = 0, lastT = 0;
svg.addEventListener("pointerdown", (e) => {
  dragging = true; moved = 0; sx = lastX = e.clientX; sy = e.clientY; lastT = performance.now(); vel = 0;
  svg.setPointerCapture(e.pointerId); svg.classList.add("dragging"); pause(); kick();
});
svg.addEventListener("pointermove", (e) => {
  if (dragging) {
    const box = svg.getBoundingClientRect(), scale = W / box.width;
    const dx = e.clientX - lastX, now = performance.now();
    moved += Math.abs(dx) + Math.abs(e.movementY || 0);
    yaw -= (dx * scale) / R;
    vel = (-(dx * scale) / R) / Math.max(0.008, (now - lastT) / 1000);
    if (e.pointerType === "mouse") tilt = Math.min(40, Math.max(4, tilt + (e.movementY || 0) * 0.25));
    lastX = e.clientX; lastT = now;
    return;
  }
  if (e.pointerType !== "mouse") return;
  const el = e.target.closest(".band,.label");
  const i = el ? +el.dataset.i : null;
  if (i !== hover) { hover = i; render(); }
});
const end = (e) => {
  if (!dragging) return;
  dragging = false; svg.classList.remove("dragging");
  if (performance.now() - lastT > 80) vel = 0;
  if (moved < 6) {              // a tap or click, not a drag: select the band under the pointer
    const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".band,.label");
    const i = el ? +el.dataset.i : null;
    pinned = i === null || pinned === i ? null : i;
    hover = null;
  }
  render(); kick();
};
svg.addEventListener("pointerup", end);
svg.addEventListener("pointercancel", end);
svg.addEventListener("pointerleave", (e) => { if (!dragging && hover !== null) { hover = null; render(); } });
svg.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowLeft") yaw += 0.15; else if (k === "ArrowRight") yaw -= 0.15;
  else if (k === "ArrowUp") tilt = Math.min(40, tilt + 3); else if (k === "ArrowDown") tilt = Math.max(4, tilt - 3);
  else if (k === "Enter" || k === " ") pinned = pinned === null ? 0 : (pinned + 1) % geo.counts.length;
  else if (k === "Escape") pinned = null;
  else return;
  e.preventDefault(); pause(); render();
});

// ---- numbers from numbers.csv: every positive number in the second column, top to bottom ----
async function loadNumbers() {
  try {
    const res = await fetch(DATA_FILE + "?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return null;
    const text = (await res.text()).replace(/^﻿/, "");
    const nums = [];
    for (const line of text.split(/\r?\n/)) {
      const cells = line.split(/[,;\t]/).map((c) => c.trim().replace(/^"|"$/g, ""));
      if (cells.length < 2 || cells[0].toLowerCase() === "total") continue;
      const v = Number(cells[1]);
      if (cells[1] !== "" && isFinite(v) && v > 0) nums.push(v);
    }
    return nums.length ? nums : null;
  } catch { return null; }
}

setup(COUNTS); render(); kick();
loadNumbers().then((nums) => { if (nums && nums.join() !== COUNTS.join()) { COUNTS = nums; pinned = hover = null; setup(COUNTS); render(); } });
</script>
</body>
</html>
