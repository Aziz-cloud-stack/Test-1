<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 1</title>
<style>
:root{--ink:#2b2622;--muted:#7d746b;--accent:#6d28d9;--line:#e8e2da;--panel:#ffffff;--soft:#f6f2ec}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:"Segoe UI",Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;height:100%}
#view{position:relative;min-height:420px}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.bar button{pointer-events:auto}
button{font-weight:600;font-size:13px;font-family:inherit;border:1px solid var(--line);color:var(--ink);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:absolute;bottom:12px;left:12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 10px;border-radius:6px}
aside{border-left:1px solid var(--line);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px;background:var(--panel)}
aside h2{margin:0;font-size:20px}
aside .sub{margin:0;color:var(--muted);font-size:13px}
.total{font-size:28px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right}
tr.room-row{cursor:pointer}
tr.room-row:hover td{background:var(--soft)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.1)}
.note{font-size:12px;color:var(--muted);margin:0}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div class="bar">
      <button data-view="outside" class="on" type="button">Outside</button>
      <button data-view="upper" type="button">Upper floor</button>
      <button data-view="ground" type="button">Ground floor</button>
      <button id="structure" type="button" aria-pressed="false">Structure</button>
      <button id="back" type="button" hidden>← Whole villa</button>
    </div>
    <div class="hint">Drag to rotate · scroll or pinch to zoom · click a room to go inside</div>
  </div>
  <aside id="panel"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------------- data (dummy; overridden by rooms.csv) ----------------
const FALLBACK_CSV = `room,item,quantity,unit,unit_price_sar
Structure,Foundation concrete,85,m3,450
Structure,Reinforcement steel,14,t,3200
Structure,Columns and beams,40,m3,520
Structure,Block walls,420,m2,95
Structure,Roof slab,190,m2,310
Living room,Porcelain floor tiles,63,m2,180
Living room,Wall plaster and paint,110,m2,45
Living room,Gypsum ceiling,63,m2,85
Living room,Windows (double glazed),4,pcs,2800
Living room,Lighting and electrics,1,set,9500
Kitchen,Floor tiles,49,m2,160
Kitchen,Cabinets,9,m,2400
Kitchen,Quartz countertop,7,m,1350
Kitchen,Appliances,1,set,26000
Kitchen,Wall tiles,22,m2,140
Guest bathroom,Floor and wall tiles,38,m2,170
Guest bathroom,Sanitary ware,1,set,7800
Guest bathroom,Plumbing,1,set,5200
Master bedroom,Wood flooring,96,m2,210
Master bedroom,Wall plaster and paint,120,m2,45
Master bedroom,Built-in wardrobe,4,m,3100
Master bedroom,Windows (double glazed),3,pcs,2800
Bedroom 2,Wood flooring,56,m2,210
Bedroom 2,Wall plaster and paint,86,m2,45
Bedroom 2,Built-in wardrobe,2.5,m,3100
Bathroom,Floor and wall tiles,46,m2,170
Bathroom,Bathtub and sanitary ware,1,set,12500
Bathroom,Plumbing,1,set,6100`;

// plan in metres: x across (0-16), z depth (0-12); floor 0 = ground, 1 = upper
const ROOMS = [
  { name: "Living room", floor: 0, x: 0, z: 0, w: 9, d: 12, floorColor: 0xd9c7ad, kind: "living" },
  { name: "Kitchen", floor: 0, x: 9, z: 0, w: 7, d: 7, floorColor: 0xe8e4dc, kind: "kitchen" },
  { name: "Guest bathroom", floor: 0, x: 12, z: 7, w: 4, d: 5, floorColor: 0xcfd8dc, kind: "bath" },
  { name: "Master bedroom", floor: 1, x: 0, z: 0, w: 8, d: 12, floorColor: 0xb98d63, kind: "bed" },
  { name: "Bedroom 2", floor: 1, x: 8, z: 0, w: 8, d: 7, floorColor: 0xc49a70, kind: "bed2" },
  { name: "Bathroom", floor: 1, x: 12, z: 7, w: 4, d: 5, floorColor: 0xcfd8dc, kind: "bathtub" },
];
const STAIR = { x: 9, z: 7, w: 3, d: 5 };
const FH = 3.2, WALL = 0.18, W = 16, D = 12;

let ITEMS = [];
function parseCsv(text) {
  const rows = text.replace(/^﻿/, "").trim().split(/\r?\n/).slice(1);
  return rows.map((line) => {
    const c = line.split(",").map((s) => s.trim());
    return { room: c[0], item: c[1], qty: +c[2] || 0, unit: c[3] || "", price: +c[4] || 0 };
  }).filter((r) => r.room && r.item);
}
const sar = (n) => "SAR " + Math.round(n).toLocaleString();
const costOf = (room) => ITEMS.filter((i) => i.room === room).reduce((s, i) => s + i.qty * i.price, 0);
const roomOf = (name) => ROOMS.find((r) => r.name === name);

// ---------------- scene ----------------
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 4; controls.maxDistance = 70;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d0c4, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(-18, 30, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25 });
scene.add(sun);

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...extra });
function block(w, h, d, color, x, y, z, parent, opts = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), opts.material || mat(color));
  m.position.set(x, y, z);
  m.castShadow = opts.shadow !== false; m.receiveShadow = true;
  parent.add(m);
  return m;
}
const house = new THREE.Group();
house.position.set(-W / 2, 0, -D / 2);
scene.add(house);

// garden, path and pool
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), mat(0xb7cc98));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
block(2, 0.05, 6, 0xe7dccb, 2, 0.03, D + 3, house, { shadow: false });
block(9, 0.3, 4.5, 0xeee7dc, 11.5, 0.15, D + 4.2, house);
block(7, 0.05, 2.8, 0, 11.5, 0.31, D + 4.2, house, { shadow: false, material: mat(0x7fc4d8, { roughness: 0.2 }) });
function tree(x, z, s = 1) {
  const t = new THREE.Group();
  block(0.25 * s, 2.4 * s, 0.25 * s, 0x8a6a4a, 0, 1.2 * s, 0, t);
  const crown = new THREE.Mesh(new THREE.SphereGeometry(1.2 * s, 16, 12), mat(0x7aa35a));
  crown.position.y = 3 * s; crown.castShadow = true; t.add(crown);
  t.position.set(x, 0, z); scene.add(t);
}
tree(-13, 4); tree(-11, -9, 0.8); tree(13, -8, 0.9); tree(15, 6, 0.7);

// floors and rooms
const floors = [new THREE.Group(), new THREE.Group()];
floors.forEach((g, i) => { g.position.y = i * FH; house.add(g); });
const roomGroups = {};
const wallMats = [];
function wallMat(color) { const m = mat(color, { transparent: true }); wallMats.push(m); return m; }

ROOMS.forEach((r) => {
  const g = new THREE.Group(); g.userData.room = r.name;
  floors[r.floor].add(g); roomGroups[r.name] = g;
  block(r.w - WALL, 0.1, r.d - WALL, r.floorColor, r.x + r.w / 2, 0.35, r.z + r.d / 2, g);
  const H = FH - 0.3, y = 0.3 + H / 2;
  [
    [r.w, WALL, r.x + r.w / 2, r.z, r.z === 0],
    [r.w, WALL, r.x + r.w / 2, r.z + r.d, r.z + r.d === D],
    [WALL, r.d, r.x, r.z + r.d / 2, r.x === 0],
    [WALL, r.d, r.x + r.w, r.z + r.d / 2, r.x + r.w === W],
  ].forEach(([sw, sd, sx, sz, outside]) => block(sw, H, sd, 0, sx, y, sz, g, { material: wallMat(outside ? 0xefe4d2 : 0xfaf7f2) }));
  furnish(r, g);
});
const stairs = new THREE.Group(); floors[0].add(stairs);
// outside wall in front of the stair hall, on both floors
block(3, FH - 0.3, WALL, 0, 10.5, 0.3 + (FH - 0.3) / 2, D, stairs, { material: wallMat(0xefe4d2) });
const hall = new THREE.Group(); floors[1].add(hall);
block(4, FH - 0.3, WALL, 0, 10, 0.3 + (FH - 0.3) / 2, D, hall, { material: wallMat(0xefe4d2) });
for (let i = 0; i < 10; i++) block(STAIR.w - 0.4, 0.2, 0.45, 0xb08d68, STAIR.x + STAIR.w / 2, 0.4 + i * 0.29, STAIR.z + STAIR.d - 0.3 - i * 0.45, stairs);
function slab(y, color, parent) { return block(W + 0.3, 0.3, D + 0.3, color, W / 2, y, D / 2, parent); }
const groundSlab = slab(0.15, 0xdcd3c6, floors[0]);
const upperSlab = slab(0.15, 0xdcd3c6, floors[1]);
const roof = new THREE.Group(); roof.position.y = 2 * FH; house.add(roof);
slab(0.15, 0xe9e1d5, roof);
[[W / 2, D + 0.1], [W / 2, -0.1]].forEach(([x, z]) => block(W + 0.5, 0.6, 0.3, 0xefe4d2, x, 0.6, z, roof));
[[-0.1, D / 2], [W + 0.1, D / 2]].forEach(([x, z]) => block(0.3, 0.6, D + 0.5, 0xefe4d2, x, 0.6, z, roof));
// windows and front door, attached to the room that owns that wall
const glass = mat(0x9ec9dc, { roughness: 0.15, metalness: 0.1 });
const win = (room, x, z, rotate) => { const m = block(rotate ? 0.08 : 1.8, 1.5, rotate ? 1.8 : 0.08, 0, x, 1.7, z, roomGroups[room], { material: glass, shadow: false }); return m; };
win("Living room", 4.5, D + 0.1); win("Living room", 7, D + 0.1); win("Living room", 3, -0.1); win("Kitchen", 13, -0.1);
win("Master bedroom", 2.5, D + 0.1); win("Master bedroom", 6, D + 0.1); win("Bedroom 2", 12, -0.1); win("Bedroom 2", W + 0.1, 3.5, true);
block(1.3, 2.3, 0.1, 0x7b5a3c, 2, 1.45, D + 0.12, roomGroups["Living room"]);

// structure: columns, beams and raft foundation
const structure = new THREE.Group(); structure.visible = false; house.add(structure);
for (let f = 0; f < 2; f++) for (const x of [0, 8, 16]) for (const z of [0, 6, 12]) block(0.35, FH, 0.35, 0x9a9a9a, x, f * FH + FH / 2, z, structure);
for (let f = 1; f <= 2; f++) {
  for (const z of [0, 6, 12]) block(W, 0.4, 0.3, 0xa8a8a8, W / 2, f * FH - 0.2, z, structure);
  for (const x of [0, 8, 16]) block(0.3, 0.4, D, 0xa8a8a8, x, f * FH - 0.2, D / 2, structure);
}
block(W + 1.2, 0.6, D + 1.2, 0x8d8d8d, W / 2, -0.3, D / 2, structure);

// ---------------- furniture ----------------
function furnish(r, g) {
  const cx = r.x + r.w / 2, cz = r.z + r.d / 2, y0 = 0.4;
  const B = (w, h, d, c, x, z, y = 0) => block(w, h, d, c, x, y0 + y + h / 2, z, g);
  if (r.kind === "living") {
    B(3.4, 0.03, 2.6, 0xcbb79a, cx, cz);
    B(3.2, 0.45, 1, 0x8c9aa3, cx, cz + 2.2); B(3.2, 0.45, 0.25, 0x7d8b94, cx, cz + 2.6, 0.45);
    B(1.4, 0.4, 0.8, 0x9b7653, cx, cz);
    B(2.6, 0.5, 0.45, 0x6f5a46, cx, r.z + 0.5); B(1.8, 1, 0.08, 0x222222, cx, r.z + 0.45, 0.6);
    B(2, 0.75, 1.1, 0x9b7653, cx - 2.3, r.z + 3.6);
  }
  if (r.kind === "kitchen") {
    B(r.w - 0.6, 0.9, 0.65, 0xf1ece4, cx, r.z + 0.5); B(r.w - 0.6, 0.05, 0.68, 0x6f6a66, cx, r.z + 0.5, 0.9);
    B(0.65, 0.9, 3, 0xf1ece4, r.x + r.w - 0.5, r.z + 2.3);
    B(2.4, 0.9, 1.1, 0xe6dccd, cx - 0.3, cz + 0.6); B(2.5, 0.05, 1.2, 0x6f6a66, cx - 0.3, cz + 0.6, 0.9);
    B(0.9, 2, 0.75, 0xd0d4d6, r.x + 0.7, r.z + 0.55);
  }
  if (r.kind === "bath" || r.kind === "bathtub") {
    if (r.kind === "bathtub") B(1.7, 0.55, 0.8, 0xffffff, cx, r.z + 0.6);
    else B(0.9, 0.05, 0.9, 0xd9e6ea, r.x + 0.7, r.z + 0.7);
    B(0.9, 0.85, 0.5, 0xf4f1ec, r.x + r.w - 0.7, r.z + r.d - 0.45);
    B(0.4, 0.45, 0.6, 0xffffff, r.x + 0.5, r.z + r.d - 0.6);
  }
  if (r.kind === "bed" || r.kind === "bed2") {
    const big = r.kind === "bed";
    B(big ? 2 : 1.4, 0.5, 2.1, 0xe9e2d6, cx, r.z + 1.4); B(big ? 2 : 1.4, 0.12, 1.3, 0xb7a5c9, cx, r.z + 1.8, 0.5);
    B(big ? 2.1 : 1.5, 0.9, 0.12, 0x8a6a4a, cx, r.z + 0.32, 0.2);
    B(0.5, 0.5, 0.45, 0x8a6a4a, cx - (big ? 1.4 : 1.1), r.z + 0.5); B(0.5, 0.5, 0.45, 0x8a6a4a, cx + (big ? 1.4 : 1.1), r.z + 0.5);
    B(big ? 3 : 2, 2.2, 0.6, 0xd8c4a8, cx, r.z + r.d - 0.45);
  }
}

// ---------------- views ----------------
let mode = "outside", focusRoom = null, showStructure = false;
const goal = { pos: new THREE.Vector3(26, 20, 30), target: new THREE.Vector3(0, 3, 0) };
camera.position.copy(goal.pos); controls.target.copy(goal.target);
let flying = 0;
function flyTo(pos, target) { goal.pos.copy(pos); goal.target.copy(target); flying = 1; }

function apply() {
  const r = focusRoom ? roomOf(focusRoom) : null;
  roof.visible = mode === "outside" && !r;
  floors[1].visible = r ? r.floor === 1 : mode !== "ground";
  floors[0].visible = !(r && r.floor === 1);
  ROOMS.forEach((rr) => { roomGroups[rr.name].visible = !r || rr.name === focusRoom; });
  stairs.visible = !r; hall.visible = !r;
  structure.visible = showStructure;
  wallMats.forEach((m) => { m.opacity = showStructure ? 0.18 : 1; m.depthWrite = !showStructure; m.needsUpdate = true; });
  document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("on", !r && b.dataset.view === mode));
  document.getElementById("back").hidden = !r;
  renderPanel();
}
function setMode(m) {
  mode = m; focusRoom = null;
  if (m === "outside") flyTo(new THREE.Vector3(26, 20, 30), new THREE.Vector3(0, 3, 0));
  if (m === "upper") flyTo(new THREE.Vector3(14, 26, 22), new THREE.Vector3(0, FH, 0));
  if (m === "ground") flyTo(new THREE.Vector3(14, 22, 22), new THREE.Vector3(0, 0, 0));
  apply();
}
function enterRoom(name) {
  const r = roomOf(name);
  focusRoom = name;
  const c = new THREE.Vector3(r.x + r.w / 2 - W / 2, r.floor * FH + 0.8, r.z + r.d / 2 - D / 2);
  const reach = Math.max(r.w, r.d);
  flyTo(c.clone().add(new THREE.Vector3(reach * 0.55, reach * 0.95 + 2, reach * 0.9)), c);
  apply();
}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const targets = Object.values(roomGroups).filter((g) => g.visible && g.parent.visible);
  const hit = ray.intersectObjects(targets, true)[0];
  if (!hit) return;
  let o = hit.object; while (o && !o.userData.room) o = o.parent;
  if (o && o.userData.room !== focusRoom) enterRoom(o.userData.room);
});
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.view)));
document.getElementById("back").addEventListener("click", () => setMode(mode === "outside" ? "upper" : mode));
document.getElementById("structure").addEventListener("click", (e) => {
  showStructure = !showStructure;
  e.currentTarget.classList.toggle("on", showStructure); e.currentTarget.setAttribute("aria-pressed", showStructure);
  apply();
});

// ---------------- side panel ----------------
const panel = document.getElementById("panel");
function renderPanel() {
  const total = ITEMS.reduce((s, i) => s + i.qty * i.price, 0) || 1;
  const name = focusRoom || (showStructure ? "Structure" : null);
  if (name) {
    const r = roomOf(name), rows = ITEMS.filter((i) => i.room === name);
    panel.innerHTML = `<div><h2>${name}</h2><p class="sub">${r ? (r.floor ? "Upper floor" : "Ground floor") + " · " + r.w + " × " + r.d + " m" : "Foundation, columns, beams, walls and slabs"}</p></div>
      <div class="total">${sar(costOf(name))}</div>
      <table><thead><tr><th>Material</th><th class="num">Qty</th><th class="num">Cost</th></tr></thead><tbody>
      ${rows.map((i) => `<tr><td>${i.item}</td><td class="num">${i.qty} ${i.unit}<br><span class="sub">× ${i.price.toLocaleString()}</span></td><td class="num">${sar(i.qty * i.price)}</td></tr>`).join("")}
      </tbody></table>
      <p class="note">${((100 * costOf(name)) / total).toFixed(1)}% of the villa's total ${sar(total)}.</p>`;
    return;
  }
  const names = ["Structure", ...ROOMS.map((rr) => rr.name)];
  panel.innerHTML = `<div><h2>Two-storey villa</h2><p class="sub">16 × 12 m · ${ROOMS.length} rooms · dummy prices</p></div>
    <div class="total">${sar(total)}</div>
    <table><thead><tr><th>Part</th><th class="num">Cost</th><th class="num">Share</th></tr></thead><tbody>
    ${names.map((n) => { const rr = roomOf(n); const col = rr ? "#" + rr.floorColor.toString(16).padStart(6, "0") : "#9a9a9a"; return `<tr class="room-row" data-room="${n}"><td><span class="swatch" style="background:${col}"></span>${n}</td><td class="num">${sar(costOf(n))}</td><td class="num">${((100 * costOf(n)) / total).toFixed(0)}%</td></tr>`; }).join("")}
    </tbody></table>
    <p class="note">Click a row or a room to zoom in. Prices come from rooms.csv.</p>`;
  panel.querySelectorAll(".room-row").forEach((tr) => tr.addEventListener("click", () => {
    const n = tr.dataset.room;
    if (n === "Structure") { if (!showStructure) document.getElementById("structure").click(); return; }
    enterRoom(n);
  }));
}

// ---------------- loop ----------------
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
controls.addEventListener("start", () => (flying = 0));
function tick() {
  if (flying > 0) {
    camera.position.lerp(goal.pos, 0.08); controls.target.lerp(goal.target, 0.08);
    if (camera.position.distanceTo(goal.pos) < 0.05) flying = 0;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

ITEMS = parseCsv(FALLBACK_CSV);
apply(); resize(); tick();
fetch("rooms.csv?v=" + Date.now(), { cache: "no-store" })
  .then((r) => (r.ok ? r.text() : null))
  .then((t) => { if (t) { const rows = parseCsv(t); if (rows.length) { ITEMS = rows; renderPanel(); } } })
  .catch(() => {});
</script>
</body>
</html>
